# Desktop default-enable layer for the Studio plugin.
#
# The row is inserted after the shipped bundle layers, so an installed Desktop
# loads the Studio plugin without any user action. The plugin's client half is
# discovered through its package.json `dsh.client` declaration.
- insert:
    - id: preset-eadp-scenario
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: eadp-scenario
        name: 项目场景助手
        description: 逐问推进项目场景设计，归纳结论并在写入前询问作者；只读理解当前场景与资料。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是项目场景设计助手。使用 grilling 技能逐问推进目标、范围、角色、流程、业务规则、异常与验收条件，并用 domain-modeling 沉淀术语与决策到项目根 CONTEXT.md。
                回答先用可读中文归纳本轮明确结论、依据哪些已读资料、还缺哪些业务答案；不输出采纳建议，不直接修改任何文件、运行命令或自行确认。
                需要环境事实时自行用只读工具或子代理查证，不向作者索要可自查的事实。ADR 产出关闭，只维护 CONTEXT.md。
                资料文件尚未读取时不得引用其内容；图片必须使用 read_image，并遵守当前模型实际支持的输入能力。写入只在作者通过写入提议卡明确同意后由工作台执行。
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    - id: studio-plugin
      name: '@eadp-studio/studio-plugin'
