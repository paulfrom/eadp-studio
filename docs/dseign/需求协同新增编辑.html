<style>
body{overflow:hidden}.workspace{height:calc(100vh - var(--titlebar-height));display:flex;flex-direction:column}.work-head{padding:20px 26px 15px;background:#fff;border-bottom:1px solid var(--line)}.breadcrumbs{font-size:11px;color:var(--muted);margin-bottom:10px}.heading-row,.panel-head,.panel-foot,.source-bar{display:flex;justify-content:space-between;align-items:center;gap:10px}.heading-row h1{font-size:20px}.identity{display:flex;gap:9px;align-items:center;margin-top:5px;font-size:11px}.source-bar{padding:10px 26px;background:#f4f7ff;border-bottom:1px solid var(--line);font-size:11px}.source-bar .sources{display:flex;gap:6px;flex-wrap:wrap}.work-grid{display:grid;grid-template-columns:48% 52%;min-height:0;flex:1}.conversation,.document{min-height:0;display:flex;flex-direction:column;background:#fff}.conversation{background:#f6f9ff;border-right:1px solid var(--line)}.panel-head{height:53px;min-height:53px;padding:0 20px;border-bottom:1px solid var(--line);background:#fff}.panel-title{font-weight:600;display:flex;align-items:center;gap:9px}.agent-mark{width:27px;height:27px;display:grid;place-items:center;color:#fff;background:var(--primary);border-radius:7px;font-size:13px}.chat-scroll{overflow:auto;flex:1;padding:22px}.intro{color:var(--muted);font-size:12px;line-height:1.9}.read-state{padding:10px 12px;background:#edf3ff;border:1px solid #dce6f7;border-radius:4px;margin-top:12px;font-size:11px}.message{margin:18px 0;font-size:12px}.message.user{background:#e9effd;border-radius:8px 8px 0 8px;padding:12px;margin-left:35px}.message .sender{font-size:10px;letter-spacing:1px;font-weight:600;color:var(--primary);margin-bottom:7px}.suggestion{background:#fff;border:1px solid var(--line);border-radius:5px;margin:10px 0;overflow:hidden}.suggestion label{display:flex;gap:8px;padding:12px 13px 7px;font-weight:600}.suggestion p{padding:0 13px 12px;white-space:pre-wrap;font-size:12px;color:#50627b}.suggestion .actions{padding:9px 12px;background:#f8faff;border-top:1px solid #e6edf7}.suggestion.expired{opacity:.6}.composer{padding:15px 20px;border-top:1px solid var(--line);background:#fff}.composer textarea{width:100%;height:75px;resize:none;border:1px solid var(--line);border-radius:5px;padding:11px;font-size:12px}.composer .actions{justify-content:space-between;margin-top:9px}.document-tabs{display:flex;gap:15px}.document-tabs button{border:0;background:none;color:var(--muted);padding:15px 0;border-bottom:2px solid transparent}.document-tabs button.active{color:var(--primary);border-color:var(--primary)}.doc-area{flex:1;min-height:0;overflow:auto;background:#fcfdff}.markdown{padding:30px 34px;font-size:13px;line-height:1.95;overflow-wrap:anywhere;max-width:900px;margin:auto}.markdown h1{font-size:24px;margin:0 0 22px;line-height:1.5}.markdown h2{font-size:16px;border-bottom:1px solid var(--line);padding-bottom:7px;margin:24px 0 12px;color:#163a78}.markdown h3{font-size:14px;margin:16px 0 8px}.markdown p{margin:5px 0}.markdown ul{padding-left:22px}.markdown blockquote{border-left:3px solid #abc0e6;background:#eff4fc;padding:7px 12px;color:#64748b;margin:10px 0}.empty-doc{padding:70px 35px;color:var(--muted);text-align:center}.empty-doc span{display:block;font-size:34px;color:#b2c3df;margin-bottom:12px}#source{border:0;resize:none;background:#fcfdff;width:100%;height:100%;padding:25px 30px;line-height:1.85;font:12px/1.9 Consolas,'Microsoft YaHei',monospace;color:#26466e;outline:none}.panel-foot{font-size:10px;padding:10px 20px;border-top:1px solid var(--line);background:#fff}.work-status{padding:10px 26px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:11px}.restore{display:none}.panel-closed .work-grid{grid-template-columns:1fr}.panel-closed .document{display:none}.panel-closed .restore{display:inline-flex}.stack{display:flex;flex-direction:column;gap:12px}.source-item{padding:12px;background:#f5f8ff;border:1px solid var(--line);border-radius:4px}.source-item blockquote{margin:9px 0 0;font-size:12px;line-height:1.8;color:#526783}.form-note{font-size:11px;color:var(--muted);margin-top:5px}.check-condition{display:flex;gap:9px;padding:10px 0;align-items:flex-start;font-size:12px}.check-condition input{margin-top:4px;accent-color:var(--primary)}.compare-input{font-size:10px;background:#f5f8ff;padding:10px;margin:8px 0;overflow-wrap:anywhere}.result-box{padding:14px;border:1px solid var(--line);margin:12px 0;border-radius:4px}.comparison-heading{display:flex;justify-content:space-between;gap:8px}.section-label{font-size:11px;color:var(--muted);margin:16px 0 8px}.local-file{max-height:180px;overflow:auto;white-space:pre-wrap;font:11px/1.8 Consolas,monospace;padding:12px;background:#f5f8ff}.block-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.notice{color:#8b651a;background:#fff7e6;padding:10px 12px;border-radius:4px;font-size:11px;margin:10px 0}.read-only{color:#466b9d;background:#eef5ff;padding:8px 20px;font-size:11px}.template-preview{white-space:pre-wrap;max-height:220px;overflow:auto;background:#f5f8ff;padding:15px;font-size:11px}.busy{color:var(--primary)}@media(max-width:1000px){.work-head{padding:14px 18px}.heading-row{align-items:flex-start}.heading-row h1{font-size:17px}.source-bar{padding:9px 18px}.panel-head{padding:0 12px}.chat-scroll{padding:15px}.markdown{padding:23px}.work-status{padding:8px 18px}.heading-row .actions{flex-wrap:wrap;justify-content:flex-end}.identity .mono{display:none}}@media(max-width:760px){.work-grid{grid-template-columns:1fr}.document{display:none}.restore{display:inline-flex}.work-status{flex-wrap:wrap}.heading-row h1{font-size:15px}}
</style></head><body><div id="app-shell"></div><main class="main-content"><div class="workspace" id="workspace"><header class="work-head"><div class="breadcrumbs"><a href="需求协同列表.html">需求协同</a> <span> / </span> 需求工作区</div><div class="heading-row"><div><h1 id="title"></h1><div class="identity"><strong class="mono" id="code"></strong><span id="status"></span><span class="muted mono" id="path"></span></div></div><div class="actions"><button class="btn" id="compare-button">⇄ 一致性对比</button><button class="btn primary" id="confirm-button">确认需求</button></div></div></header><div class="source-bar"><div class="sources" id="source-chips"></div><div class="actions"><button class="btn ghost small" id="sources-button">查看来源</button><button class="btn ghost small" id="prereq-button">前置需求</button></div></div><div class="work-grid"><section class="conversation"><div class="panel-head"><div class="panel-title"><span class="agent-mark">✧</span>需求设计助手 <span class="badge blue">仅提建议</span></div><button class="btn ghost small" id="new-session">＋ 新会话</button></div><div class="chat-scroll" id="chat"><div class="intro"><strong style="color:var(--text)">把业务想清楚，再落成需求。</strong><p>结合当前材料与已选来源整理建议。你可以逐条、整块或全部采纳，正文由你决定。</p><div class="read-state" id="read-state"></div></div><div id="messages"></div></div><div class="composer"><textarea id="prompt" aria-label="需求设计输入" placeholder="描述要补充的业务条件，或选择下方入口整理已读材料…"></textarea><div class="actions"><div class="actions"><button class="btn small" id="materials-button">＋ 资料</button><button class="btn small" id="template-button">需求模板</button></div><button class="btn primary small" id="suggest-button">生成建议 ↑</button></div><div class="form-note">本页演示建议交互；不连接模型。GWT 可选。</div></div></section><section class="document"><div class="panel-head"><div class="document-tabs"><button class="active" data-tab="preview">Markdown 预览</button><button data-tab="source">源码编辑</button></div><div class="actions"><button class="btn ghost small" id="export-button">↓ 导出</button><button class="btn ghost small" id="collapse-button" aria-label="收起文档">⇥</button></div></div><div id="readonly" class="read-only" hidden>已确认版本只读。开始修订只解锁当前需求。</div><div class="doc-area"><article class="markdown" id="preview"></article><textarea id="source" aria-label="Markdown 源码" spellcheck="false" hidden></textarea></div><div class="panel-foot"><span id="save-state">已保存至本机演示</span><span id="body-size" class="mono"></span></div></section></div><footer class="work-status"><span id="quality-state"></span><div class="actions"><span id="comparison-status" class="muted">对比独立于确认</span><button class="btn small restore" id="restore-button">显示文档</button><button class="btn ghost small" id="review-button">材料自检</button></div></footer></div></main><dialog id="modal"><div class="modal-head"><div><h2 id="modal-title"></h2><p id="modal-subtitle"></p></div><button class="btn ghost small" id="modal-close" aria-label="关闭弹窗">✕</button></div><div class="modal-body" id="modal-body"></div><div class="modal-footer" id="modal-footer"></div></dialog><script src="requirements-demo.js"></script>
<script>
'use strict';
const D=window.RequirementsDemo,$=id=>document.getElementById(id),esc=D.escape;
const params=new URLSearchParams(location.search);let req=D.get(params.get('id'))||D.list().find(x=>x.code==='REQ-0009')||D.list()[0];let saveTimer,tab='preview',suggestions=[],suggestionRevision=0,comparisonRunning=false,attachment=null;
const label=x=>typeof x==='string'?x:x.title||'';
// Formal sources retain the selected fixed version; comparisons read local sample inputs separately.
const fixedSource=id=>({...D.scene(id),...req.sourceRefs.find(ref=>ref.scenarioId===id)});
const uuid=()=>req.assetUuid;
const filepath=()=>`需求/${uuid()}.md`;
function modal(title,subtitle,body,buttons){$('modal-title').textContent=title;$('modal-subtitle').textContent=subtitle;$('modal-body').innerHTML=body;$('modal-footer').innerHTML=buttons||'<button class="btn" data-close>关闭</button>';if(!$('modal').open)$('modal').showModal();$('modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('modal').close());}
$('modal-close').onclick=()=>$('modal').close();
function markdown(body){if(!body.trim())return '<div class="empty-doc"><span>▤</span><strong>从空白需求开始</strong><p>手工编辑，或在左侧生成建议并采纳。</p></div>';return body.split('\n').map(line=>{const safe=esc(line);if(/^### /.test(line))return '<h3>'+safe.slice(4)+'</h3>';if(/^## /.test(line))return '<h2>'+safe.slice(3)+'</h2>';if(/^# /.test(line))return '<h1>'+safe.slice(2)+'</h1>';if(/^> /.test(line))return '<blockquote>'+safe.slice(2)+'</blockquote>';return '<p>'+safe.replace(/^[-*] /,'• ')+'</p>';}).join('');}
function refresh(){D.mountShell({active:'requirements',requirement:req});$('title').textContent=req.title;$('code').textContent=req.code;$('path').textContent=filepath();$('status').innerHTML=`<span class="badge ${req.status==='confirmed'?'green':'amber'}">${req.status==='confirmed'?'已确认 · '+req.version:'本地草稿'}</span>`;$('source-chips').innerHTML=(req.scenarioIds||[]).map(id=>{const s=D.scene(id);return s?`<span class="badge blue">${esc(s.code)} ${esc(s.title)}${s.builtin?' · 系统内置':''}</span>`:'';}).join('');$('source').value=req.body||'';$('source').readOnly=req.status==='confirmed';$('preview').innerHTML=markdown(req.body||'');$('readonly').hidden=req.status!=='confirmed';$('confirm-button').textContent=req.status==='confirmed'?'开始修订':'确认需求';$('body-size').textContent=(req.body||'').length+' 字符';$('quality-state').textContent=req.status==='confirmed'?'● 演示确认记录 · 当前材料只读':'● 当前需求独立整理与确认';$('read-state').textContent=`已读：当前需求${req.status==='draft'?'草稿':'确认版'}、${req.scenarioIds.length} 个所选来源片段、当前需求模板${attachment?'、'+attachment.name:''}。来源只读。`;$('save-state').textContent='已保存至本机演示';}
function save(patch){req=D.update(req.id,patch);refresh();renderSuggestions();if(D.load().comparisons.some(c=>c.requirementId===req.id))$('comparison-status').textContent='已有对比可能过期 · 不影响确认';}
function flush(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;save({body:$('source').value,metricsStale:true,quality:null});}}
$('source').oninput=()=>{if(req.status==='confirmed')return;$('save-state').textContent='保存中…';clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=null;save({body:$('source').value,metricsStale:true,quality:null});},800);};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{flush();tab=b.dataset.tab;$('source').hidden=tab!=='source';$('preview').hidden=tab!=='preview';document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));});
$('collapse-button').onclick=()=>$('workspace').classList.add('panel-closed');$('restore-button').onclick=()=>$('workspace').classList.remove('panel-closed');
$('export-button').onclick=()=>{flush();const meta={assetId:uuid(),code:req.code,scenarioIds:req.scenarioIds,sourceRefs:req.sourceRefs,templateId:req.templateId,rules:req.rules,questions:req.questions,quality:req.quality};const blob=new Blob([req.body+'\n\n<!-- eadp-metadata\n'+JSON.stringify(meta,null,2)+'\n-->\n'],{type:'text/markdown;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=uuid()+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);D.toast('已导出当前需求 Markdown');};
refresh();
</script>
<script>
function renderSuggestions(){document.querySelectorAll('[data-suggestion]').forEach(el=>{const item=suggestions.find(s=>s.id===el.dataset.suggestion);if(!item)return;const expired=suggestionRevision!==req.revision;el.classList.toggle('expired',expired||item.applied);el.querySelector('.suggestion-state').textContent=item.applied?'已采纳':expired?'内容已变化 · 建议过期':'待采纳';el.querySelectorAll('button,input').forEach(b=>b.disabled=expired||item.applied||req.status==='confirmed');});}
function propose(texts){suggestionRevision=req.revision;suggestions=texts.map((x,i)=>({...x,id:'s'+i,applied:false}));const wrap=document.createElement('div');wrap.className='message';wrap.innerHTML='<div class="sender">✧ 需求设计助手 · 演示建议</div><p class="muted">依据已读片段或你的输入整理，未写入正文。未明确的条件仍需业务确认。</p>'+suggestions.map((s,i)=>`<div class="suggestion" data-suggestion="${s.id}"><label><input type="checkbox" data-pick="${s.id}" checked>${esc(s.title)} <span class="badge gray suggestion-state">待采纳</span></label><p>${esc(s.text)}</p><div class="actions"><button class="btn small" data-adopt="${s.id}">采纳本条</button><button class="btn small" data-block="${esc(s.block)}">采纳整块 · ${esc(s.block)}</button></div></div>`).join('')+'<div class="block-actions"><button class="btn primary small" data-adopt-selected>一次采纳所选</button><button class="btn small" data-adopt-all>全部采纳</button></div>';$('messages').replaceChildren(wrap);wrap.querySelectorAll('[data-adopt]').forEach(b=>b.onclick=()=>adopt([b.dataset.adopt]));wrap.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>adopt(suggestions.filter(s=>s.block===b.dataset.block).map(s=>s.id)));wrap.querySelector('[data-adopt-selected]').onclick=()=>adopt([...wrap.querySelectorAll('[data-pick]:checked')].map(x=>x.dataset.pick));wrap.querySelector('[data-adopt-all]').onclick=()=>adopt(suggestions.map(s=>s.id));renderSuggestions();$('chat').scrollTop=$('chat').scrollHeight;}
function adopt(ids){flush();if(req.status==='confirmed')return D.toast('请先显式开始当前需求修订');if(suggestionRevision!==req.revision)return D.toast('当前材料或模板已变化，请重新生成建议');const selected=suggestions.filter(s=>ids.includes(s.id)&&!s.applied);if(!selected.length)return D.toast('请选择待采纳建议');selected.forEach(s=>s.applied=true);const addition=selected.map(s=>`## ${s.title}\n\n${s.text}`).join('\n\n');save({body:(req.body.trim()?req.body.trim()+'\n\n':'')+addition,metricsStale:true,quality:null});D.toast('已一次写入 '+selected.length+' 条；剩余旧建议已过期');}
$('suggest-button').onclick=()=>{flush();const text=$('prompt').value.trim();if(!text&&!req.summary&&!req.body.trim())return D.toast('新建正文为空，请先输入业务目标或明确规则');if(text){const msg=document.createElement('div');msg.className='message user';msg.textContent=text;$('chat').appendChild(msg);}const parts=[];if(text)parts.push({title:'业务补充（用户输入）',block:'补充',text});if(attachment&&attachment.body.trim())parts.push({title:'所选资料摘录（用户提供）',block:'资料',text:attachment.body});if(req.summary)parts.push({title:'目标与范围',block:'整理',text:req.summary});if(req.rules&&req.rules.length&&!req.metricsStale)parts.push({title:'现有业务规则整理',block:'整理',text:req.rules.map(label).join('\n')});if(!parts.length)parts.push({title:'当前材料整理',block:'整理',text:req.body});propose(parts);$('prompt').value='';};
$('new-session').onclick=()=>{suggestions=[];$('messages').innerHTML='';$('chat').querySelectorAll('.message.user').forEach(x=>x.remove());D.toast('已新建会话；当前需求、模板、来源与已读资料保留');};
function sources(){modal('正式来源','同项目：eadp-core-design · 固定版本不会因打开或修订自动升级',(req.scenarioIds||[]).map(id=>{const s=fixedSource(id);return `<section class="source-item"><strong>${esc(s.code)} · ${esc(s.title)}</strong> <span class="badge ${s.builtin?'gray':'green'}">${s.builtin?'系统内置':'已确认'} · ${esc(s.version)}</span><div class="form-note">场景/${esc(s.assetUuid)}.md · ${s.builtin?'预置说明':'固定版本 / 业务规则片段（示例）'}</div><blockquote>${esc(s.excerpt)}</blockquote>${s.builtin?'<div class="notice">仅提供场景归属，不构成本需求的业务依据。</div>':''}</section>`;}).join('<div style="height:12px"></div>'));}
$('sources-button').onclick=sources;
function prereqs(){const chosen=req.prerequisites||[];modal('前置需求','生产顺序独立于场景来源；未完成前置需求只影响原型生产。','<div class="info-band">本页仅维护当前需求的前置版本，不改变关联材料。禁止自引用、重复及环。</div><div class="check-list">'+D.list().filter(r=>r.id!==req.id&&r.status==='confirmed').map(r=>`<label class="check-row"><input type="checkbox" name="pre" value="${esc(r.id)}" ${chosen.some(x=>(x.id||x)===r.id)?'checked':''} ${req.status==='confirmed'?'disabled':''}><span><strong>${esc(r.code)} ${esc(r.title)}</strong><small>${esc(r.version)} · 原型完成证据：未核对</small></span></label>`).join('')+'</div><div class="error-line" id="pre-error"></div>','<button class="btn" data-close>取消</button><button class="btn primary" id="save-pre" '+(req.status==='confirmed'?'disabled':'')+'>保存关系</button>');$('save-pre').onclick=()=>{const ids=[...document.querySelectorAll('[name=pre]:checked')].map(x=>x.value);function reaches(id,seen=new Set()){if(id===req.id)return true;if(seen.has(id))return false;seen.add(id);const r=D.get(id);return r&&(r.prerequisites||[]).some(p=>reaches(p.id||p,seen));}if(ids.some(id=>reaches(id)))return $('pre-error').textContent='关系会形成环，请调整所选前置需求';save({prerequisites:ids.map(id=>({id,version:D.get(id).version}))});$('modal').close();D.toast('已保存前置版本；不阻止当前文档确认');};}
$('prereq-button').onclick=prereqs;
function quality(continueConfirm=false){flush();if(req.status==='confirmed')return modal('材料自检','当前已确认材料只读','<div class="info-band">当前材料已由用户明确确认。开始修订后可更新业务规则、依据、验收条件及问题处理。</div>');const ordinary=req.scenarioIds.map(fixedSource).filter(s=>s&&!s.builtin);const q=req.quality||{};const questions=(req.questions||[]).map(x=>typeof x==='string'?{title:x,core:true,resolved:false}:x);const acceptance=(req.body.match(/## 验收[^\n]*\n+([\s\S]*?)(?=\n## |$)/)||[])[1]||'';modal('材料自身检查','按业务含义核对当前内容；章节名称、字数及 GWT 语法不作为门禁。',`<div class="info-band">当前来源 ${req.scenarioIds.length} 项；正文 ${req.body.trim()?'已填写':'空白'}。独立对比、差异和模型失败不参与以下检查。</div><div class="field"><label for="q-rules">核心规则（核对正文中的明确业务条件）</label><textarea id="q-rules" rows="3">${esc(q.rules||(!req.metricsStale?(req.rules||[]).map(label).join('\n'):''))}</textarea></div><div class="field"><label for="q-acceptance">可判断的验收条件（与正文逐项核对）</label><textarea id="q-acceptance" rows="3">${esc(q.acceptance||acceptance.trim())}</textarea></div><div class="field"><label for="q-evidence">正式业务依据及原文片段定位</label><textarea id="q-evidence" rows="3" placeholder="通用场景不提供业务依据，请填写已核对的业务资料及片段">${esc(q.evidence||ordinary.map(s=>s.code+' '+s.version+' / 业务规则：'+s.excerpt).join('\n'))}</textarea></div><div class="section-label">材料内待澄清项（勾选表示你已明确业务答案）</div>${questions.length?questions.map((x,i)=>`<label class="check-condition"><input type="checkbox" data-q="${i}" ${x.resolved?'checked':''}><span>${esc(x.title)} <span class="badge ${x.core?'amber':'gray'}">${x.core?'核心问题':'非阻断问题'}</span></span></label><div class="field"><input data-answer="${i}" aria-label="澄清答复" placeholder="勾选已解决时填写明确答复（核心问题必填）" value="${esc(x.resolution||'')}"></div>`).join(''):'<p class="muted">无核心待澄清项。</p>'}<label class="check-condition"><input type="checkbox" id="q-review"><span>我已阅读当前正文，核对上述规则、验收及依据确实存在且明确；来源在同一项目且固定版本有效。</span></label><div class="error-line" id="q-error" role="alert"></div>`,'<button class="btn" data-close>取消</button><button class="btn primary" id="save-quality">'+(continueConfirm?'保存自检并继续':'保存自检')+'</button>');$('save-quality').onclick=()=>{const rules=$('q-rules').value.trim(),acceptance=$('q-acceptance').value.trim(),evidence=$('q-evidence').value.trim();const updated=questions.map((x,i)=>({...x,resolved:document.querySelector(`[data-q="${i}"]`).checked,resolution:document.querySelector(`[data-answer="${i}"]`).value.trim()}));const validSources=req.scenarioIds.length&&req.scenarioIds.every(id=>D.scene(id));if(!req.body.trim()||!rules||!acceptance||!evidence||!$('q-review').checked||!validSources||updated.some(x=>x.core&&(!x.resolved||!x.resolution)))return $('q-error').textContent='请补齐正文、明确规则、验收、真实业务依据，解决核心问题并完成阅读核对。';let nextBody=req.body;updated.filter(x=>x.resolved&&x.resolution).forEach(x=>{nextBody=nextBody.replace('- [ ] '+x.title,'- [x] '+x.title+'\n  答复：'+x.resolution);});save({body:nextBody,quality:{rules,acceptance,evidence,reviewed:true},questions:updated,metricsStale:true});$('modal').close();if(continueConfirm)confirmDialog();else D.toast('已保存业务自检；仍需用户明确确认');};}
function confirmDialog(){modal('确认当前需求',`${req.code} · 只确认本材料，不冻结或自动确认关联场景。`,`<div class="source-item"><strong>${esc(req.title)}</strong><p class="form-note mono">${esc(filepath())}</p><p style="margin-top:10px">规则、验收、业务依据及核心问题已由你逐项核对。确认后当前材料只读，可独立开始修订。</p></div><div class="notice">本页只产生“演示确认记录”，不执行真实 Git 或协同后台操作。一致性对比将在确认后独立运行，其差异或失败不撤销确认。</div>`,'<button class="btn" data-close>取消</button><button class="btn primary" id="final-confirm">我已阅读，确认需求</button>');$('final-confirm').onclick=()=>{const n=parseInt(String(req.version).replace(/^v/,''),10)||0;save({status:'confirmed',version:'v'+(n+1)+'.0',confirmRecord:{kind:'演示确认记录',at:new Date().toISOString(),revision:req.revision}});$('modal').close();D.toast('已建立演示确认记录；对比独立启动');runComparison('auto');};}
function revise(){modal('开始当前需求修订','影响清单先供判断；关联材料保持原状。',`<p>将解锁 <strong>${esc(req.code)} ${esc(req.title)}</strong>。</p><div class="section-label">关联来源（仅提示可能影响）</div>${req.scenarioIds.map(id=>{const s=D.scene(id);return '<div class="source-item">'+esc(s.code)+' '+esc(s.title)+' · '+esc(s.version)+' · 保持不变</div>';}).join('')}<div class="notice">修订不升级来源引用；不解锁、修改或冻结其他需求和场景。</div>`,'<button class="btn" data-close>取消</button><button class="btn primary" id="start-revision">开始本需求修订</button>');$('start-revision').onclick=()=>{save({status:'draft',quality:null});$('modal').close();D.toast('只解锁当前需求，关联材料未改变');};}
$('confirm-button').onclick=()=>req.status==='confirmed'?revise():quality(true);$('review-button').onclick=()=>quality(false);
</script>
<script>
let comparisonMode='complete-diff',lastInputs=[],uploadTemplate=null;
async function digest(text){const bytes=new TextEncoder().encode(text);const out=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(out)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function runComparison(trigger='manual'){flush();if(comparisonRunning)return D.toast('本次对比仍在运行');comparisonRunning=true;$('comparison-status').textContent='● 一致性对比运行中…';const revision=req.revision,mode=comparisonMode,body=req.body;const scenes=req.scenarioIds.map(D.scene).filter(Boolean);const snapshots=[{path:filepath(),body,status:req.status==='draft'?'本机草稿':'演示确认版'},...scenes.map(s=>({path:'场景/'+(s.assetUuid)+'.md',body:s.excerpt,status:s.builtin?'系统内置示例':'本机来源示例（固定片段）'}))];if($('modal').open&&$('modal').dataset.kind==='comparison')comparisonPanel();try{lastInputs=await Promise.all(snapshots.map(async s=>({path:s.path,hash:await digest(s.body),status:s.status})));await new Promise(resolve=>setTimeout(resolve,750));const failed=mode==='failed',partial=mode==='partial';const result=D.addComparison(req.id,{status:failed?'failed':'completed',coverage:partial?'partial':'complete',trigger,requirementRevision:revision,inputs:lastInputs,uncovered:partial?['本机示例没有其他成员的私有工作区材料；潜在关联范围未覆盖。']:failed?['演示模型失败，本次未生成可用对比结论。']:[],summary:failed?'对比失败（演示）':partial?'范围不足（演示）':mode==='complete-clear'?'本次已读示例范围未发现差异':'完整读取示例范围，发现待核对差异（演示）'});if(!failed&&mode==='complete-diff')D.addFinding({requirementId:req.id,scenarioId:req.scenarioIds[0],comparisonId:result.id,summary:'演示待核对项：需求的细化约束与已读来源片段是否一致，需由用户判断修改方向。'});$('comparison-status').textContent=result.summary+(req.revision!==revision?' · 相对当前材料已过期':'');}catch(e){$('comparison-status').textContent='对比失败 · 不影响材料确认';D.toast(e.message);}finally{comparisonRunning=false;if($('modal').open&&$('modal').dataset.kind==='comparison')comparisonPanel();}}
function findingRows(){const fs=D.load().findings.filter(f=>f.requirementId===req.id);return fs.length?fs.map(f=>`<section class="finding"><div class="finding-meta"><span class="badge ${f.status==='pending'?'amber':'gray'}">${{pending:'待处理',handled:'已登记处理',ignored:'已忽略'}[f.status]}</span><small>${f.reminder?'◷ 已提醒':'未提醒'}</small></div><p>${esc(f.summary)}</p><textarea data-note="${esc(f.id)}" aria-label="处理说明" placeholder="可选：填写处理说明">${esc(f.note||'')}</textarea><div class="actions"><button class="btn small" data-finding="${esc(f.id)}" data-action="ignored">忽略</button><button class="btn small" data-finding="${esc(f.id)}" data-action="handled">登记已处理</button><button class="btn small" data-finding="${esc(f.id)}" data-action="reminder">${f.reminder?'取消提醒':'提醒我'}</button><button class="btn small" data-direction="${esc(f.id)}">修改方向…</button></div><div class="finding-note">处理记录独立保存；登记处理不表示材料已一致。</div></section>`).join(''):'<p class="muted">当前没有差异记录。历史处理不会随新对比自动关闭。</p>';}
function comparisonPanel(){$('modal').dataset.kind='comparison';const all=D.load().comparisons.filter(c=>c.requirementId===req.id).slice().reverse();modal('一致性对比','只读本页本机示例材料；不读取真实工作区，不执行 Git、模型或网络请求。',`<div class="info-band">来源与需求独立确认。差异、范围不足、失败、旧结果均不影响确认。</div><div class="field"><label for="compare-mode">演示情形（人为选择，不代表实际模型结论）</label><select id="compare-mode"><option value="complete-diff">完整 · 含待核对差异</option><option value="complete-clear">完整 · 已读范围未发现差异</option><option value="partial">范围不足</option><option value="failed">对比失败</option></select></div><div class="actions"><button class="btn primary small" id="run-compare" ${comparisonRunning?'disabled':''}>${comparisonRunning?'正在只读对比…':'开始只读对比'}</button><span class="muted" style="font-size:11px">先正式关系，再潜在关联（本演示无额外文件）</span></div><div class="section-label">对比记录 · ${comparisonRunning?'运行中':''}</div>${all.length?all.map(c=>`<section class="result-box"><div class="comparison-heading"><strong>${esc(c.summary||'历史演示结果')}</strong><span class="badge ${c.status==='failed'||c.coverage==='partial'?'amber':'blue'}">${c.requirementRevision!==req.revision?'相对本机材料已过期':'当前输入'}</span></div><p class="form-note">${esc(c.createdAt)} · ${c.trigger==='auto'?'确认后自动':'手动'} · 独立结果</p>${(c.inputs||[]).map(i=>`<div class="compare-input"><strong>${esc(i.path)}</strong> · ${esc(i.status||'本机示例')}<br><span class="mono">SHA-256: ${esc(i.hash)}</span></div>`).join('')}${(c.uncovered||[]).map(x=>'<div class="notice">未覆盖：'+esc(x)+'</div>').join('')}</section>`).join(''):'<p class="muted">尚未对比。确认需求后会自动启动一次独立演示。</p>'}<div class="section-label">共享演示差异 · 保留历史</div>${findingRows()}`);$('compare-mode').value=comparisonMode;$('compare-mode').onchange=e=>comparisonMode=e.target.value;$('run-compare').onclick=()=>runComparison('manual');document.querySelectorAll('[data-finding]').forEach(b=>b.onclick=()=>{const f=D.load().findings.find(x=>x.id===b.dataset.finding);const note=document.querySelector(`[data-note="${f.id}"]`).value;D.updateFinding(f.id,{...(b.dataset.action==='reminder'?{reminder:!f.reminder}:{status:b.dataset.action}),note});comparisonPanel();D.toast('只更新差异处理记录；材料正文未变化');});document.querySelectorAll('[data-direction]').forEach(b=>b.onclick=()=>direction(b.dataset.direction));}
$('compare-button').onclick=comparisonPanel;
$('modal').addEventListener('close',()=>{delete $('modal').dataset.kind;});
function direction(id){const f=D.load().findings.find(x=>x.id===id),s=D.scene(f.scenarioId);$('modal').dataset.kind='direction';modal('选择修改方向','选择方向只生成拟修改清单；不会写入任何关联文件。',`<p>${esc(f.summary)}</p><div class="field" style="margin-top:18px"><label for="direction-select">目标材料</label><select id="direction-select"><option value="requirement">按场景依据修订当前需求</option><option value="scenario">按需求细化建议修订来源场景</option></select></div><div class="field"><label for="direction-text">拟修改内容（用户明确业务答案）</label><textarea id="direction-text" rows="4" placeholder="输入已确认的具体规则；本页不替你裁决冲突。"></textarea></div><div id="direction-info" class="info-band">拟修改：${esc(filepath())}。将先显示建议，采纳才写当前草稿。</div><div class="error-line" id="direction-error"></div>`,'<button class="btn" data-close>取消</button><button class="btn primary" id="direction-propose">生成拟修改建议</button>');$('direction-select').onchange=e=>$('direction-info').textContent=e.target.value==='scenario'?'拟修改：场景/'+(s?s.code:'来源场景')+'。需在场景工作区独立开始修订；当前页不会写场景。':'拟修改：'+filepath()+'。将先显示建议，采纳才写当前草稿。';$('direction-propose').onclick=()=>{const text=$('direction-text').value.trim();if(!text)return $('direction-error').textContent='请先填写明确业务答案，不根据差异摘要编造规则。';if($('direction-select').value==='scenario'){modal('拟修改清单 · 来源场景','需在目标场景工作区独立修订及确认。',`<div class="source-item"><strong>${esc(s?s.code+' '+s.title:'来源场景')}</strong><p>${esc(text)}</p></div><div class="notice">这是用户输入的拟修改建议。场景文件、关系与确认状态均未改变。</div>`,'<button class="btn" data-close>返回需求</button><a class="btn primary" href="项目场景列表.html">打开场景入口 ↗</a>');}else{$('modal').close();propose([{title:'业务规则修订建议（用户明确）',block:'修订',text}]);D.toast(req.status==='confirmed'?'建议已提出；开始当前需求修订后重新生成再采纳':'已提出建议，尚未写入正文');}};}
</script>
<script>
function templates(){flush();const items=D.load().templates;uploadTemplate=null;modal('需求模板','项目共享演示目录；模板切换不改当前正文，不自动更换已有材料绑定。',`<div class="field"><label for="template-select">选择模板</label><select id="template-select">${items.map(t=>`<option value="${esc(t.id)}">${esc(t.title)} · ${esc(t.version)}</option>`).join('')}</select></div><pre class="template-preview" id="template-preview"></pre><div class="field"><label for="template-file">上传本地 Markdown 模板</label><input type="file" id="template-file" accept=".md,.markdown,text/markdown"><div class="form-note">先预览，再明确发布到项目演示目录；不会自动设为默认或改写正文。</div></div><div class="field" id="template-name-field" hidden><label for="template-name">模板名称</label><input id="template-name" maxlength="100"></div><div class="error-line" id="template-error"></div>`,'<button class="btn" data-close>取消</button><button class="btn" id="publish-template" disabled>发布到共享演示</button><button class="btn primary" id="bind-template" '+(req.status==='confirmed'?'disabled':'')+'>使用所选模板</button>');$('template-select').value=req.templateId;$('template-preview').textContent=items.find(t=>t.id===req.templateId)?.body||'';$('template-select').onchange=e=>{$('template-preview').textContent=D.load().templates.find(t=>t.id===e.target.value)?.body||'';};$('template-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!/\.(md|markdown)$/i.test(file.name))return $('template-error').textContent='请选择 Markdown 文件';if(file.size>512000)return $('template-error').textContent='演示模板限 500 KB 以内';const body=await file.text();uploadTemplate={title:file.name.replace(/\.(md|markdown)$/i,''),body};$('template-preview').textContent=body;$('template-name').value=uploadTemplate.title;$('template-name-field').hidden=false;$('publish-template').disabled=!body.trim();};$('publish-template').onclick=()=>{if(!uploadTemplate)return;const published=D.publishTemplate({title:$('template-name').value,body:uploadTemplate.body});const option=document.createElement('option');option.value=published.id;option.textContent=published.title+' · '+published.version;$('template-select').appendChild(option);$('template-select').value=published.id;uploadTemplate=null;$('publish-template').disabled=true;D.toast('模板已发布至共享演示目录；当前正文与绑定未改变');};$('bind-template').onclick=()=>{const id=$('template-select').value;if(!D.load().templates.some(t=>t.id===id))return $('template-error').textContent='请先选择或发布有效需求模板';if(req.status==='confirmed')return D.toast('请先开始当前需求修订');save({templateId:id});$('modal').close();D.toast('已切换模板；正文保留，旧建议已过期');};}
$('template-button').onclick=templates;
$('materials-button').onclick=()=>{modal('本次已读资料','文件只在当前会话内读取；新会话保留已选资料，不冒充正式业务依据。',`<div class="info-band">已读当前需求与 ${req.scenarioIds.length} 个正式来源片段。普通来源可作为核对依据；通用说明仅提供归属。</div><div class="field"><label for="material-file">添加本机文本资料</label><input id="material-file" type="file" accept=".md,.markdown,.txt,text/plain,text/markdown"><div class="form-note">仅支持 Markdown / TXT 读取预览，不做多格式提取或上传。</div></div><div class="section-label" id="attachment-state">${attachment?'已读取 '+esc(attachment.name):'尚未添加资料'}</div><pre class="local-file" id="attachment-preview"></pre>`);$('attachment-preview').textContent=attachment?.body||'';$('material-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!/\.(txt|md|markdown)$/i.test(file.name))return D.toast('本演示仅支持 Markdown / TXT');if(file.size>512000)return D.toast('演示资料限 500 KB 以内');try{attachment={name:file.name,body:await file.text()};$('attachment-state').textContent='已读取：'+file.name+' · 当前会话资料';$('attachment-preview').textContent=attachment.body;refresh();}catch(error){$('attachment-state').textContent='读取失败：'+error.message;}};};
function newRequirement(){const data=D.load();modal('新建需求','先命名并明确选择普通场景或通用场景；创建后正文为空。',`<div class="field"><label for="new-title">需求名称 <span style="color:#9b6606">*</span></label><input id="new-title" maxlength="100" placeholder="按可独立交付的业务能力命名"></div><div class="field"><label>来源场景（可多选） <span style="color:#9b6606">*</span></label><div class="check-list">${data.scenarios.map(s=>`<label class="check-row"><input type="checkbox" name="new-source" value="${esc(s.id)}"><span><strong>${esc(s.code)} ${esc(s.title)} ${s.builtin?'<span class="badge gray">系统内置</span>':''}</strong><small>${esc(s.version)} · ${s.builtin?'只提供归属，不提供业务依据':'同项目已确认普通场景'}</small></span></label>`).join('')}</div></div><div class="field"><label for="new-template">需求模板</label><select id="new-template">${data.templates.map(t=>`<option value="${esc(t.id)}">${esc(t.title)} · ${esc(t.version)}</option>`).join('')}</select><div class="form-note">模板只引导后续建议，不自动生成首稿；无分类输入。</div></div><div class="error-line" id="create-error" role="alert"></div>`,'<a class="btn" href="需求协同列表.html">返回目录</a><button class="btn primary" id="create-requirement">创建空白需求</button>');$('create-requirement').onclick=()=>{const title=$('new-title').value.trim(),scenarioIds=[...document.querySelectorAll('[name=new-source]:checked')].map(x=>x.value);if(!title||!scenarioIds.length)return $('create-error').textContent='请填写名称并至少选择一个有效来源场景';try{req=D.create({title,scenarioIds,body:'',templateId:$('new-template').value,rules:[],questions:[]});history.replaceState({},'',location.pathname+'?id='+encodeURIComponent(req.id));$('modal').close();suggestions=[];$('messages').innerHTML='';refresh();D.toast('已创建 '+req.code+'；正文空白，来源已保留');}catch(error){$('create-error').textContent=error.message;}};}
if(params.get('new')==='1')newRequirement();
window.addEventListener('beforeunload',()=>flush());
</script>
</body></html>
