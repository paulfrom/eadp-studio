<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>需求协同 · EADP Studio</title><link rel="stylesheet" href="requirements-demo.css"></head>
<body><div id="app-shell"></div><main class="main-content"><div class="page requirements-list">
<header class="page-title"><div class="title-identity"><span class="list-title-icon">▤</span><div><h1>需求协同 <span class="title-count" id="heading-count"></span></h1><p class="muted">从场景细化业务能力，独立整理与确认每一项需求。</p></div></div><div class="actions"><button class="btn" id="all-findings">项目差异</button><button class="btn" id="split-open">从场景拆分</button><button class="btn primary" id="create-open">＋ 新建需求</button></div></header>
<div class="list-toolbar"><div class="tabs" role="tablist" aria-label="需求状态"><button type="button" role="tab" data-status="all" class="active">全部需求 <span class="tab-count" id="count-all"></span></button><button type="button" role="tab" data-status="draft">草稿 <span class="tab-count" id="count-draft"></span></button><button type="button" role="tab" data-status="confirmed">已确认 <span class="tab-count" id="count-confirmed"></span></button></div>
<div class="filter-bar"><label class="search-wrap"><span class="search-symbol">⌕</span><span class="sr-only">搜索需求名称或编号</span><input id="search" type="search" placeholder="搜索需求名称或编号"></label><label><span class="sr-only">来源场景筛选</span><select id="source"><option value="">全部来源场景</option></select></label><label><span class="sr-only">排序</span><select id="sort"><option value="updated">最近更新</option><option value="code">编号升序</option><option value="title">名称排序</option></select></label><button class="btn ghost" id="clear">清除筛选</button></div></div>
<div class="grid-summary"><span id="result-count"></span><span>业务内容与独立差异分别管理</span></div><section id="requirements-grid" class="requirements-grid" aria-label="需求列表"></section><footer class="pagination"><span id="page-summary"></span><div id="pages" class="pages"></div></footer>
</div></main><div id="overlays"></div><script src="requirements-demo.js"></script><script>
'use strict';
const D=window.RequirementsDemo,E=D.escape;let status='all',page=1;const pageSize=8;
D.mountShell({active:'requirements'});
const $=id=>document.getElementById(id);
function count(value){return Array.isArray(value)?value.length:'未统计';}
function render(){const data=D.load(),all=data.requirements,q=$('search').value.trim().toLocaleLowerCase(),source=$('source').value;
document.querySelector('.nav-count').textContent=all.length;
$('heading-count').textContent=all.length+' 项';
['all','draft','confirmed'].forEach(s=>{$('count-'+s).textContent=s==='all'?all.length:all.filter(r=>r.status===s).length;});
document.querySelectorAll('[data-status]').forEach(b=>{b.classList.toggle('active',b.dataset.status===status);b.setAttribute('aria-selected',String(b.dataset.status===status));});
let items=all.filter(r=>(status==='all'||r.status===status)&&(!source||r.scenarioIds.includes(source))&&(!q||r.title.toLocaleLowerCase().includes(q)||r.code.toLowerCase().includes(q)));
items.sort((a,b)=>$('sort').value==='code'?a.code.localeCompare(b.code):$('sort').value==='title'?a.title.localeCompare(b.title,'zh-CN'):b.updatedAt.localeCompare(a.updatedAt)||b.code.localeCompare(a.code));
const total=items.length,totalPages=Math.max(1,Math.ceil(total/pageSize));page=Math.min(page,totalPages);const visible=items.slice((page-1)*pageSize,page*pageSize);
$('result-count').textContent='共 '+total+' 项需求'+(q||source||status!=='all'?' · 已筛选':'');
$('requirements-grid').innerHTML=visible.length?visible.map(r=>{const fs=data.findings.filter(f=>f.requirementId===r.id),pending=fs.filter(f=>f.status==='pending').length;const rules=r.metricsStale?'未统计':count(r.rules);const questions=r.metricsStale?'未统计':Array.isArray(r.questions)?r.questions.filter(x=>x.core!==false&&!x.resolved).length:'未统计';return '<article class="card requirement-card '+r.status+'"><div class="card-body"><div class="card-header"><span class="req-code">'+E(r.code)+'</span><span class="badge '+(r.status==='confirmed'?'blue':'gray')+'">'+(r.status==='confirmed'?'已确认 · '+E(r.version):'草稿')+'</span></div><a class="requirement-title" href="需求协同新增编辑.html?id='+encodeURIComponent(r.id)+'">'+E(r.title)+'</a><p class="requirement-summary">'+E(r.summary||'正文空白，等待整理需求。')+'</p><div class="source-chips">'+r.scenarioIds.map(id=>{const s=D.scene(id);return s?'<span class="source-chip">'+E(s.code)+' '+E(s.title)+(s.builtin?' · 系统内置':' · '+E(r.sourceRefs.find(ref=>ref.scenarioId===id)?.version||'引用不可读'))+'</span>':'<span class="badge amber">来源不可读</span>';}).join('')+'</div><div class="card-metrics"><div class="metric"><span>业务规则</span><strong>'+rules+(rules==='未统计'?'':' 条')+'</strong></div><div class="metric"><span>核心待澄清</span><strong class="'+(questions>0?'amber':'')+'">'+questions+(questions==='未统计'?'':' 项')+'</strong></div><button class="metric clickable" data-findings="'+E(r.id)+'" type="button"><span>独立差异 · 查看</span><strong class="'+(pending?'amber':'')+'">'+pending+' 待处理 <small class="muted">/ '+fs.length+'</small></strong></button></div></div><footer class="card-footer"><div class="people"><span>创建 '+E(r.creator)+'</span><span>编辑 '+E(r.editor)+'</span></div><span>修订 '+r.revision+' · '+E(r.updatedAt.slice(0,10))+'</span></footer></article>';}).join(''):'<div class="empty-state"><div class="empty-icon">▤</div><h2>'+(all.length?'未找到匹配的需求':'尚无协同需求')+'</h2><p>'+(all.length?'试试其他名称、编号或来源场景。':'命名并选择来源场景，开始整理第一项需求。')+'</p><button class="btn" id="empty-clear">'+(all.length?'清除筛选':'新建需求')+'</button></div>';
$('page-summary').textContent=total?'显示 '+((page-1)*pageSize+1)+'—'+Math.min(page*pageSize,total)+' / 共 '+total+' 项':'显示 0 / 共 0 项';
$('pages').innerHTML='<button class="btn small" data-page="'+(page-1)+'" '+(page===1?'disabled':'')+'>← 上一页</button>'+Array.from({length:totalPages},(_,i)=>'<button class="btn small page-number '+(i+1===page?'active':'')+'" data-page="'+(i+1)+'">'+(i+1)+'</button>').join('')+'<button class="btn small" data-page="'+(page+1)+'" '+(page===totalPages?'disabled':'')+'>下一页 →</button>';
}
function clearFilters(){status='all';page=1;$('search').value='';$('source').value='';$('sort').value='updated';render();}
$('source').insertAdjacentHTML('beforeend',D.load().scenarios.map(s=>'<option value="'+E(s.id)+'">'+E(s.code+' '+s.title)+(s.builtin?'（系统内置）':'')+'</option>').join(''));
$('search').addEventListener('input',()=>{page=1;render();});['source','sort'].forEach(id=>$(id).addEventListener('change',()=>{page=1;render();}));$('clear').onclick=clearFilters;
document.addEventListener('click',event=>{const tab=event.target.closest('[data-status]'),p=event.target.closest('[data-page]');if(tab){status=tab.dataset.status;page=1;render();}if(p&&!p.disabled){page=Number(p.dataset.page);render();document.querySelector('.main-content').scrollTo({top:0,behavior:'smooth'});}if(event.target.id==='empty-clear'){if(D.list().length)clearFilters();else $('create-open').click();}});
render();
</script>
<script>
// Manual creation explicitly binds sources; the body starts empty.
function dialog(title,subtitle,content,buttons){const old=$('work-modal');if(old)old.remove();$('overlays').insertAdjacentHTML('beforeend','<dialog id="work-modal"><div class="modal-head"><div><h2>'+title+'</h2><p>'+subtitle+'</p></div><button class="btn ghost" data-close-modal aria-label="关闭">✕</button></div><div class="modal-body">'+content+'</div><div class="modal-footer">'+buttons+'</div></dialog>');$('work-modal').showModal();}
function sourceChoices(name,builtin){return D.load().scenarios.filter(s=>builtin||!s.builtin).map(s=>'<label class="check-row"><input type="checkbox" name="'+name+'" value="'+E(s.id)+'"><span><strong>'+E(s.code+' '+s.title)+(s.builtin?' <span class="badge blue">系统内置</span>':'')+'</strong><small>'+E(s.version)+(s.builtin?' · 仅提供来源归属':' · 已确认')+'</small></span></label>').join('');}
function selected(name){return [...document.querySelectorAll('input[name="'+name+'"]:checked')].map(input=>input.value);}
function templateOptions(){return D.load().templates.map(t=>'<option value="'+E(t.id)+'">'+E(t.title+' · '+t.version)+'</option>').join('');}
function openCreate(){dialog('新建需求','名称与来源是创建需求的起点。','<div class="field"><label for="new-title">需求名称 <span class="muted">必填</span></label><input id="new-title" maxlength="100" placeholder="输入一项可独立交付的业务能力" autofocus></div><div class="field"><label>来源场景 <span class="muted">至少选择一项，可多选</span></label><div class="check-list">'+sourceChoices('new-source',true)+'</div></div><div class="field"><label for="new-template">需求模板</label><select id="new-template">'+templateOptions()+'</select><small class="muted">正文从空白开始，模板用于后续整理建议。</small></div><div id="create-error" class="error-line" role="alert"></div>','<button class="btn" data-close-modal>取消</button><button class="btn primary" id="create-submit">创建并整理 →</button>');}
$('create-open').onclick=openCreate;
let splitCandidates=[];
function openSplit(){dialog('从场景拆分需求','可选择一个或多个已确认普通场景，多轮补拆不会修改已有需求。','<div class="field"><label>业务来源场景 <span class="muted">支持联合拆分</span></label><div class="check-list">'+sourceChoices('split-source',false)+'</div><small class="muted">通用场景不参与业务拆分。</small></div><div class="field"><label for="split-template">需求模板</label><select id="split-template">'+templateOptions()+'</select></div><div class="info-band">参考已有需求减少重复，由你选择采用哪些候选。</div><div id="split-error" class="error-line" role="alert"></div>','<button class="btn" data-close-modal>取消</button><button class="btn primary" id="split-generate">预览拆分候选</button>');}
$('split-open').onclick=openSplit;
function previewSplit(){const ids=selected('split-source');if(!ids.length){$('split-error').textContent='请至少选择一个已确认普通场景。';return;}const templateId=$('split-template').value;splitCandidates=ids.map((id,index)=>{const s=D.scene(id),existing=D.list().filter(r=>r.scenarioIds.includes(id));const title=s.title+'业务处理与异常核实';const summary=s.excerpt;return {title,summary,scenarioIds:[id],templateId,existing,rules:[{title:s.excerpt}],questions:[{title:'请结合实际业务资料补充处理角色、边界与异常验收依据。',core:true,resolved:false}],body:'# '+title+'\n\n## 目标\n\n'+summary+'\n\n## 范围\n\n本候选仅承接 '+s.code+' '+s.title+' 的已读片段，范围需要用户进一步确认。\n\n## 来源\n\n'+s.code+' '+s.version+'\n\n> '+s.excerpt+'\n\n## 业务规则\n\n- '+s.excerpt+'\n\n## 验收依据\n\n待根据正式业务依据补充可判断的验收结果。\n\n## 待澄清\n\n- [ ] 请补充处理角色、边界与异常验收依据。'};});
dialog('拆分候选','候选按实际相关来源分别归属；只有选中并采用后才创建需求。','<div class="info-band">本轮已选 '+ids.length+' 个来源，展示 '+splitCandidates.length+' 项有限示例候选。请核对已有需求，避免重复采用。</div>'+splitCandidates.map((c,i)=>'<article class="candidate-card"><label><input type="checkbox" name="candidate" value="'+i+'">'+E(c.title)+'</label><p>'+E(c.summary)+'</p><div class="source-chips">'+c.scenarioIds.map(id=>'<span class="source-chip">'+E(D.scene(id).code+' '+D.scene(id).version)+'</span>').join('')+'</div><p><small>已有相关需求：'+(c.existing.length?c.existing.map(r=>E(r.code+' '+r.title)).join('；'):'暂无')+'</small></p></article>').join('')+'<div class="error-line" id="candidate-error" role="alert"></div>','<button class="btn" id="split-back">重新选择</button><button class="btn primary" id="candidate-create">采用选中候选</button>');}
document.addEventListener('click',event=>{if(event.target.closest('[data-close-modal]'))$('work-modal')?.close();if(event.target.id==='create-submit'){try{const req=D.create({title:$('new-title').value,scenarioIds:selected('new-source'),templateId:$('new-template').value});location.href='需求协同新增编辑.html?id='+encodeURIComponent(req.id);}catch(error){$('create-error').textContent=error.message;}}if(event.target.id==='split-generate')previewSplit();if(event.target.id==='split-back')openSplit();if(event.target.id==='candidate-create'){const indexes=selected('candidate');if(!indexes.length){$('candidate-error').textContent='请先选择要采用的候选。';return;}const created=[];for(const index of indexes){try{const {existing,...candidate}=splitCandidates[Number(index)];created.push(D.create(candidate));}catch(error){$('candidate-error').textContent=error.message;return;}}$('work-modal').close();render();D.toast('已创建 '+created.length+' 项需求，原有需求保持独立。');}});
</script>

<script>
let findingScope=null;
function openFindings(id){findingScope=id||null;document.querySelector('.drawer')?.remove();document.querySelector('.drawer-backdrop')?.remove();const data=D.load(),req=id?D.get(id):null,items=data.findings.filter(f=>!id||f.requirementId===id);$('overlays').insertAdjacentHTML('beforeend','<div class="drawer-backdrop" data-close-drawer></div><section class="drawer" role="dialog" aria-modal="true" aria-label="独立差异"><header class="drawer-head"><div><h2>独立差异'+(req?' · '+E(req.code):' · 全项目')+'</h2><p>差异记录与材料状态分别管理，处理记录不会修改材料。</p></div><button class="btn ghost" data-close-drawer aria-label="关闭差异面板">✕</button></header><div class="drawer-content"><div class="grid-summary"><span>'+items.length+' 条记录 · '+items.filter(f=>f.status==='pending').length+' 条待处理</span><button class="btn small" id="finding-all" '+(!id?'disabled':'')+'>查看全项目</button></div>'+(!items.length?'<div class="empty-state"><h3>暂无独立差异记录</h3><p>暂无记录不代表材料已完全一致。</p></div>':items.map(f=>{const r=D.get(f.requirementId),s=D.scene(f.scenarioId);return '<article class="finding" data-finding="'+E(f.id)+'"><div class="finding-meta"><a href="需求协同新增编辑.html?id='+encodeURIComponent(f.requirementId)+'" class="mono">'+E(r?.code||'需求不存在')+'</a><span class="badge '+(f.status==='pending'?'amber':f.status==='handled'?'blue':'gray')+'">'+({pending:'待处理',handled:'已登记处理',ignored:'已忽略'}[f.status])+'</span></div><p>'+E(f.summary)+'</p><small class="muted">来源 '+E(s?s.code+' '+s.title+' · '+s.version:'不可读')+' · 记录修订 '+f.revision+'</small>'+(f.note?'<div class="finding-note">处理说明：'+E(f.note)+'</div>':'')+'<label class="field" style="margin:10px 0 0"><span class="sr-only">差异处理说明</span><textarea placeholder="填写处理说明（登记处理时必填）" data-finding-note>'+E(f.note)+'</textarea></label><div class="actions"><button class="btn small" data-handle="'+E(f.id)+'">登记已处理</button><button class="btn small" data-ignore="'+E(f.id)+'">忽略</button><label class="switch-label"><input type="checkbox" data-reminder="'+E(f.id)+'" '+(f.reminder?'checked':'')+'>提醒</label></div><div class="error-line" data-finding-error></div></article>';}).join(''))+'</div></section>');document.querySelector('[data-close-drawer]').focus();}
$('all-findings').onclick=()=>openFindings();
document.addEventListener('click',event=>{const finding=event.target.closest('[data-findings]');if(finding)openFindings(finding.dataset.findings);if(event.target.closest('[data-close-drawer]')){document.querySelector('.drawer')?.remove();document.querySelector('.drawer-backdrop')?.remove();}if(event.target.id==='finding-all')openFindings();const handle=event.target.closest('[data-handle]'),ignore=event.target.closest('[data-ignore]');if(handle||ignore){const card=event.target.closest('.finding'),note=card.querySelector('[data-finding-note]').value.trim();if(handle&&!note){card.querySelector('[data-finding-error]').textContent='请填写处理说明，再登记已处理。';return;}try{D.updateFinding(handle?handle.dataset.handle:ignore.dataset.ignore,{status:handle?'handled':'ignored',note});render();openFindings(findingScope);D.toast(handle?'已登记处理说明，材料确认状态未改变。':'已忽略该记录，材料确认状态未改变。');}catch(error){card.querySelector('[data-finding-error]').textContent=error.message;}}});
document.addEventListener('change',event=>{if(event.target.matches('[data-reminder]')){try{D.updateFinding(event.target.dataset.reminder,{reminder:event.target.checked});D.toast(event.target.checked?'已开启该差异提醒。':'已关闭该差异提醒。');}catch(error){D.toast(error.message);}}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){document.querySelector('.drawer')?.remove();document.querySelector('.drawer-backdrop')?.remove();}});
</script></body></html>
